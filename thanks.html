<!DOCTYPE HTML>
<html>
<head>
    <title>SUCCESS | EXODUS</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <style>
        body { background: #fff; color: #000; font-family: 'Consolas', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { border: 1px solid #000; padding: 50px; text-align: center; max-width: 550px; }
        h1 { font-size: 1.2em; text-transform: uppercase; border-bottom: 1px solid #000; padding-bottom: 10px; }
        p::before { content: "> "; }
        .btn { display: inline-block; margin-top: 30px; padding: 10px 20px; background: #000; color: #fff; text-decoration: none; text-transform: uppercase; font-size: 0.8em; }
    </style>
</head>
<body>
    <div class="box" id="content">
        </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const lang = urlParams.get('lang') || 'en';
        const container = document.getElementById('content');

        if (lang === 'bg') {
            container.innerHTML = `
                <h1>СИГНАЛЪТ Е ПРИЕТ</h1>
                <p>Вашият идентификатор е потвърден. Протоколът за достъп е активиран.</p>
                <p>Проверете пощата си за следващия пакет данни.</p>
                <a href="index.html" class="btn">[ ОБРАТНО КЪМ ТЕРМИНАЛА ]</a>
            `;
        } else {
            container.innerHTML = `
                <h1>SIGNAL_RECEIVED</h1>
                <p>Your identifier has been accepted. Access protocol activated.</p>
                <p>Check your inbox for the next data packet.</p>
                <a href="index.html" class="btn">[ RETURN_TO_TERMINAL ]</a>
            `;
        }
    </script>
</body>
</html>
